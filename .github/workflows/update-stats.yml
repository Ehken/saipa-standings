name: Update stats

on:
  schedule:
    # Evening runs (UTC): covers ~16:00-24:00 Finnish time across summer/winter
    # time. Gated below so the API is only called on SaiPa game days
    # (schedule.json) - during games and a final sweep at ~23:00.
    - cron: "5 14-21 * * *"
    # Daily correction sweep at ~noon Finnish time: Liiga occasionally corrects
    # scoring afterwards (e.g. goal credited to a different player).
    - cron: "5 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip evening runs on non-game days
        id: gate
        run: |
          # Manual runs and the daily noon sweep always proceed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.schedule }}" = "5 9 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Map late-night runs back to the game evening: "3 hours ago" in
          # Helsinki time, so a run just after local midnight still counts as
          # the previous (game) day.
          GAMEDAY=$(TZ=Europe/Helsinki date -d "3 hours ago" +%F)
          if jq -e --arg d "$GAMEDAY" '.gameDates | index($d)' schedule.json > /dev/null; then
            echo "Game day ($GAMEDAY) - fetching."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SaiPa game on $GAMEDAY - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch data from the Liiga API
        if: steps.gate.outputs.run == 'true'
        run: |
          SEASON=$(jq -r '.season' config.json)
          echo "Fetching season $SEASON"
          curl -sS --fail --retry 3 --retry-delay 10 \
            -H "Accept: application/json" \
            -A "Mozilla/5.0 (compatible; saipa-standings/1.0)" \
            "https://liiga.fi/api/v2/players/stats/summed/${SEASON}/${SEASON}/runkosarja/false?team=saipa&dataType=basicStats&splitTeams=true" \
            -o /tmp/stats.json

          # Validate that the response is a JSON array before saving
          TYPE=$(jq -r 'type' /tmp/stats.json)
          if [ "$TYPE" != "array" ]; then
            echo "Error: API did not return an array (type=$TYPE). Skipping update."
            exit 1
          fi
          COUNT=$(jq 'length' /tmp/stats.json)
          echo "Players in data: $COUNT"
          # Early in the season the list may be empty - save anyway, the page handles it.
          cp /tmp/stats.json data/stats.json
          jq -n --arg t "$(date -u +%FT%TZ)" --argjson n "$COUNT" \
            '{updatedAt: $t, playerCount: $n}' > data/meta.json

      - name: Commit changes
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update stats"
            git push
          fi
